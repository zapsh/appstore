name: nginx
title: Nginx
version: [1.31.5,1.30.4]
license: Apache-2.0
homepage: https://nginx.org
platforms:
  - linux/amd64
  - linux/arm64
category: infra
description: Nginx is a web server and a reverse proxy server.
icon: nginx.png
allow_multiple_instances: 'no'
tags: [webserver]
author: zap
organization_name : zap
actions:
  build: 编译安装
scripts:
  install: install.sh
options:
  build:
    - name: OPENSSL_VERSION
      label: OpenSSL 版本
      type: select
      default: 3.5.6
      desc: 指定 OpenSSL 版本
      choices:
        - label: 3.0.16
          value: 3.0.16
        - label: 3.1.5
          value: 3.1.5
        - label: 3.5.6
          value: 3.5.6
        - label: 3.6.3
          value: 3.6.3
        - label: 4.0.1
          value: 4.0.1
    - name: MODSECURITY
      label: ModSecurity(WAF)
      type: bool
      default: false
      desc: 编译 libmodsecurity 与 ModSecurity 动态模块,并部署 OWASP CRS 规则集(默认只记录不拦截)。动态模块只能在编译时加入,已装好的 nginx 无法后期加装
