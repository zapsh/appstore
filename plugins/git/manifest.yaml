name: git
title: Git 管理
version: 1.4.0
description: 在文件管理器当前目录里管理 Git 仓库（状态 / 暂存 / 提交 / 推送 / 储藏 / 标签 / 合并变基 / 回退 / 分支维护 / 身份、远程与 SSH 密钥设置）
author: zap

# user = 以「调用方面板用户」的 Linux 账号执行（不再是 root），避免 git 把仓库文件
# 改成 root 所有、产生权限问题；工作目录由文件管理器通过 options.cwd 传入。
scope: user

# 依赖声明：装之前先确认服务器上有 git，别等到点了按钮才报 command not found
requires:
  commands: [git]

# 自带界面：同时挂在两个槽位 ——
#   file.editor     文件编辑器 / 文件管理器顶部工具栏
#   file.context    文件管理器右键菜单（把选中的文件路径带给插件）
ui:
  placement:
    - file.editor
    - file.context
  label: Git
  icon: material-symbols:deployed-code
  html: ui.html

# 声明若干入口，HTML 里用 zap.call('<action>', {...}) 分别调用；
# main.lua 里统一由 on_run 按 ctx.action 分发（也支持显式 on_<action>）。
#
# 协议：repo / log / branch / config_get 返回**单行 JSON**（前端 JSON.parse 后渲染页签），
# 其余返回可直读的文本；写操作（add / commit / push …）返回一行摘要，前端据此刷新 repo。
actions:
  status: 状态
  repo: 仓库快照
  log: 日志
  diff: 差异
  add: 暂存
  unstage: 取消暂存
  # 危险 / 破坏性动作：宿主执行前弹一次确认，只读演示账号在后端被直接拒绝
  restore: { label: 放弃修改, dangerous: true }
  commit: 提交
  branch: 分支列表
  checkout: 切换分支
  branch_create: 新建分支
  # 网络类动作用 action 级 async：只把这几个长操作变成可订阅日志流 + 可取消，
  # 其余读写保持同步（插件整体不用设 async: true）
  pull: { label: 拉取, async: true }
  push: { label: 推送, async: true }
  fetch: { label: 获取, async: true }
  init: 初始化
  clone: { label: 克隆仓库, async: true }
  stash_list: 储藏列表
  stash_save: 储藏改动
  stash_apply: 应用储藏
  stash_pop: 弹出储藏
  stash_drop: { label: 删除储藏, dangerous: true }
  tag_list: 标签列表
  tag_create: 打标签
  tag_push: { label: 推送标签, async: true }
  tag_delete: { label: 删除标签, dangerous: true }
  merge: 合并分支
  merge_continue: 继续合并
  merge_abort: { label: 中止合并, dangerous: true }
  rebase: 变基
  rebase_continue: 继续变基
  rebase_abort: { label: 中止变基, dangerous: true }
  reset: { label: 回退到某次提交, dangerous: true }
  revert: 回滚某次提交
  branch_delete: { label: 删除分支, dangerous: true }
  branch_rename: 重命名分支
  branch_delete_remote: { label: 删除远程分支, async: true, dangerous: true }
  ignore: 写入 .gitignore
  blame: 逐行作者
  config: 保存身份
  config_get: 读取身份
  remote: 设置远程
  remote_remove: 删除远程
  ssh_keys: SSH 密钥清单
  ssh_use: 设置 Git 使用的 SSH 密钥
  ssh_clear: 清除 core.sshCommand
  ssh_test: 测试 SSH 连接
  redeploy: 重新部署

# 多语言：基准字段写中文，这里给一份 en-US 覆盖层。
