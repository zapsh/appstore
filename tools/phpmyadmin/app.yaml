name: phpmyadmin
title: phpMyAdmin
version: [5.2.3]
category: tools
description: 通过浏览器管理 MySQL / MariaDB 的 PHP 工具，由面板在 /webapps/phpmyadmin/ 路径下托管并提供鉴权。属于面板级系统管理工具，不再建独立用户站点。
tags: [phpmyadmin, mysql, mariadb, tool]
# 面板级工具：系统级安装，不进用户站点目录
scope: panel
allow_multiple_instances: 'no'
dependencies:
  php: '>=7.2'
scripts:
  install: install.sh
  uninstall: uninstall.sh
  upgrade: upgrade.sh
options:
  install:
    intro: >-
      phpMyAdmin will be installed to /usr/local/apps/phpmyadmin-<version> (symlinked as
      /usr/local/apps/phpmyadmin) and exposed through the panel's /webapps/phpmyadmin/ path.
      The database credentials are NOT stored here: phpMyAdmin uses cookie auth, so you
      log in with your existing MySQL / MariaDB user and password in the browser.
    items:
      - name: DB_HOST
        label: 数据库地址
        type: string
        default: localhost
        desc: 被管理的 MySQL / MariaDB 地址（本机默认 localhost，也可填内网 IP）
      - name: DB_PORT
        label: 数据库端口
        type: number
        default: 3306
        desc: 被管理数据库的端口（MySQL / MariaDB 默认 3306）
  upgrade:
    intro: >-
      Upgrade replaces the program files with the target version and keeps your
      config.inc.php (blowfish secret and server settings), so logins stay valid.
