name: php
title: PHP
version: [8.5.12,8.4.27,8.3.36,8.2.35]
category: application
description: PHP is a server-side scripting language designed for web development.
icon: php.png
tags: [php]
allow_multiple_instances: 'yes'
scripts:
  install: install.sh
  uninstall: uninstall.sh
options:
  install:
    intro: >-
      Please select the PHP version to install.  PHP 7.4.33 has been removed. 
    items:
      - name: SET_DEFAULT
        label: Global Default
        type: bool
        default: false
        desc: Create a symbolic link php to /usr/local/bin, You can switch it on the "Service Configuration → PHP" page.
      - name: EXTS
        type: multiselect
        label: Extensions
        desc: select the PHP extensions to install.  You can select multiple extensions.
        choices:
          - label: pdo_postgresql
            value: pdo_postgresql

        